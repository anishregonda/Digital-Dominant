<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Plans | Digital Dominant</title>
    <link rel="canonical" href="https://www.digitaldominant.co.uk/services.html" />
    <meta http-equiv="refresh" content="0; url=/services.html#plans" />
    <link rel="icon" type="image/png" href="logo.png">
    <script>
      // On Vercel, /pricing.html never reaches this page: vercel.json sends it to
      // /services.html#plans with a permanent redirect. This is the fallback, and it
      // keeps an old service link (pricing.html#google-ads) pointing at the same thing.
      (function () {
        var moved = {
          '#website-rebuild': '#website-rebuild',
          '#google-ads': '#google-ads',
          '#meta-ads': '#meta-ads',
          '#custom-software': '#custom-software',
          '#lead-routing': '#custom-software',
          '#services': '#what-we-do',
          '#included': '#included',
          '#phase-1': '#phase-1',
          '#phase-2': '#phase-2',
          '#reviews-engine': '#reviews-engine',
          '#guarantee': '#guarantee',
          '#faq': '#faq'
        };
        location.replace('/services.html' + (moved[location.hash] || '#plans'));
      })();
    </script>
  </head>
  <body>
    <p>Our plans have moved to <a href="/services.html#plans">Services and Plans</a>.</p>
  </body>
</html>
